version: '3'

vars:
  COMPOSE_EXE: 'docker compose'

tasks:
  service:stop:
    desc: Stop the running LiteLLM authenticating proxy
    run: once
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cmd: |
          {{.COMPOSE_EXE}} down
    status:
      - test -z "$({{.COMPOSE_EXE}} ps --format json)"

  service:start:
    desc: Start LiteLLM authenticating proxy
    run: once
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - cmd: |
          {{.COMPOSE_EXE}} up -d
    status:
      - test -n "$({{.COMPOSE_EXE}} ps --format json)"

  service:restart:
    desc: Restart LiteLLM authenticating proxy
    run: once
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task: service:start
        silent: true
      - cmd: |
          {{.COMPOSE_EXE}} restart

  logs:
    desc: View logs for LiteLLM authenticating proxy
    run: once
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    silent: true
    cmds:
      - cmd: |
          {{.COMPOSE_EXE}} logs -f || true
